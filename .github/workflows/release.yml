name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Verify release metadata (tag == manifest.json == package.json, versions.json entry, assets)
        run: node scripts/check-versions.mjs --tag "${GITHUB_REF#refs/tags/}" --dist dist

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --draft \
            dist/*
