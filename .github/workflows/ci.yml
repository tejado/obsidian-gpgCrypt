name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      obsidian_versions:
        description: "Obsidian versions for e2e, space separated app/installer pairs (e.g. 'latest/latest 1.7.7/1.7.7 latest-beta/latest'). Empty = earliest + latest."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 26.x

jobs:
  # ---------------------------------------------------------------------------------------------
  # Static checks: lint, typecheck (build typings), version consistency, production build
  # ---------------------------------------------------------------------------------------------
  static:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Version consistency (package.json / manifest.json / versions.json)
        # Reports F27 until the release metadata is fixed; make it blocking afterwards.
        run: npm run check:versions
        continue-on-error: true
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # Typings drift (advisory): does src/ still compile against the NEWEST `obsidian` typings?
  # ---------------------------------------------------------------------------------------------
  typings-drift:
    name: typings drift (obsidian@latest, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck:drift

  # ---------------------------------------------------------------------------------------------
  # Unit / component / integration tests (Vitest) on all three OSes, incl. real-gpg wrapper tests
  # ---------------------------------------------------------------------------------------------
  test:
    name: vitest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # Git Bash on Windows → Git-for-Windows' gpg.exe is on PATH
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Prepare isolated GNUPGHOME with the TEST-ONLY fixture keys
        run: |
          bash scripts/ci-setup-gnupghome.sh
          echo "GPG_INTEGRATION=1" >> "$GITHUB_ENV"   # gates tests/unit/backend/wrapper/BackendWrapper.gpg.test.ts

      - name: Unit / component / integration tests (with coverage)
        run: |
          # what the gpg spawned from the tests will see (must be the POSIX spelling on Windows)
          node -p '"GNUPGHOME as seen by node: " + process.env.GNUPGHOME'
          npm run test:coverage

      - name: Stop gpg-agent
        if: always()
        run: gpgconf --kill all || true

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # End-to-end in REAL Obsidian (wdio-obsidian-service): earliest (minAppVersion) + latest,
  # desktop + emulated mobile, on all three OSes. Adds latest-beta when Catalyst secrets exist.
  # ---------------------------------------------------------------------------------------------
  e2e:
    name: e2e obsidian (${{ matrix.os }})
    needs: [static]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      OBSIDIAN_VERSIONS: ${{ inputs.obsidian_versions }}
      OBSIDIAN_EMAIL: ${{ secrets.OBSIDIAN_EMAIL }}
      OBSIDIAN_PASSWORD: ${{ secrets.OBSIDIAN_PASSWORD }}
      WDIO_MAX_INSTANCES: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # Resolve the concrete Obsidian versions once and use them as the cache key, so the cache is
      # invalidated exactly when "latest" (or "latest-beta") points to a new build.
      - name: Resolve Obsidian versions (cache key)
        # Downloads the Obsidian version manifest; retried because transient ECONNRESETs were seen on runners.
        run: |
          for attempt in 1 2 3; do
            if npx tsx wdio.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt; then
              break
            fi
            echo "attempt $attempt failed, retrying in 15s…"
            rm -f obsidian-versions-lock.txt
            sleep 15
          done
          [ -s obsidian-versions-lock.txt ] || { echo "could not resolve Obsidian versions"; exit 1; }
          cat obsidian-versions-lock.txt
          rm -rf .obsidian-cache
        env:
          CI: "true"
      - uses: actions/cache@v6
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('obsidian-versions-lock.txt') }}

      - name: Virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y xvfb herbstluftwm dzen2 x11-xserver-utils libgtk-3-0 libnss3 libasound2t64
          export DISPLAY=:99
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
          Xvfb $DISPLAY -screen 0 1280x1024x24 +extension GLX -noreset &
          sleep 1
          herbstluftwm &
          sleep 1

      # The GnuPG CLI wrapper backend is only exercised in real Obsidian when a gpg binary and an
      # isolated GNUPGHOME with the fixture keys are present; the Obsidian process inherits both from
      # the runner. Without this, e2e/specs/11-wrapper-backend.e2e.ts silently skips itself.
      - name: Prepare isolated GNUPGHOME with the TEST-ONLY fixture keys
        run: |
          bash scripts/ci-setup-gnupghome.sh
          echo "E2E_GPG=1" >> "$GITHUB_ENV"          # gates e2e/specs/11-wrapper-backend.e2e.ts

      - name: Run e2e tests
        run: npx wdio run ./wdio.conf.mts

      - name: Stop gpg-agent
        if: always()
        run: gpgconf --kill all || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-logs-${{ matrix.os }}
          path: logs/
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # Single required status check for branch protection
  # ---------------------------------------------------------------------------------------------
  check:
    name: all green
    if: always()
    needs: [static, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
